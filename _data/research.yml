vision: "My research aims to build next-generation intelligent control systems that learn and adapt from real-world interactions while preserving closed-loop stability, safety, robustness, and performance guarantees. My approach is to develop closed-loop adaptive reinforcement learning as a principled bridge between reinforcement learning, adaptive control, online optimization, and data-driven control."

themes:
  - id: "adaptive-rl"
    title: "Closed-Loop Adaptive Reinforcement Learning"
    url: "/research/adaptive-rl/"
    image: "/images/research/deepo.png"
    description: "I develop policy-gradient and adaptive-learning methods that update controllers directly inside feedback loops while preserving stability, robustness, and performance guarantees for dynamical systems."
    publications:
      - "Data-Enabled Policy Optimization for Direct Adaptive Learning of the LQR"
      - "Policy Gradient Adaptive Control for the LQR: Indirect and Direct Approaches"
      - "Adaptive Control of Unknown Linear Switched Systems via Policy Gradient Methods"
      - "Policy Gradient Methods for the Cost-Constrained LQR: Strong Duality and Global Convergence"
      - "Asynchronous Parallel Policy Gradient Methods for the Linear Quadratic Regulator"
      - "Convergence and Sample Complexity of Policy Gradient Methods for Stabilizing Linear Systems"
      - "Globally convergent policy gradient methods for linear quadratic control of partially observed systems"
      - "Global Convergence of Policy Gradient Primal-Dual Methods for Risk-Constrained LQRs"
      - "Primal-dual learning for the model-free risk-constrained linear quadratic regulator"
      - "Infinite-horizon Risk-constrained Linear Quadratic Regulator with Average Cost"
      - "Minimax Q-learning control for linear systems using the Wasserstein metric"

  - id: "data-driven-control"
    title: "Data-Driven Control and Online Optimization"
    url: "/research/data-driven-control/"
    image: "/images/research/ddc.png"
    description: "I study how finite data, behavioral representations, regularization, and online optimization can be turned into reliable controllers without first building a full parametric model."
    publications:
      - "A Bayesian Perspective on the Data-Driven LQR"
      - "Regularization for Covariance Parameterization of Direct Data-Driven LQR Control"
      - "Linear convergence of data-enabled policy optimization for linear quadratic tracking"
      - "Harnessing Data for Accelerating Model Predictive Control by Constraint Removal"
      - "Data-Enabled Policy Optimization for the Linear Quadratic Regulator"
      - "Data-driven control of linear systems via quantized feedback"
      - "Data-driven control of unknown linear systems via quantized feedback"

  - id: "cyber-physical"
    title: "Applications to Cyber-Physical Systems"
    url: "/research/cyber-physical/"
    image: "/images/research/bike.png"
    description: "I translate learning and data-driven control ideas to embodied and safety-critical systems, including autonomous mobility, energy networks, power electronics, aerospace systems, and transportation."
    publications:
      - "An adaptive data-enabled policy optimization approach for autonomous bicycle control"
      - "Direct adaptive control of grid-connected power converters via output-feedback data-enabled policy optimization"
      - "Unified Aeroelastic Flutter and Loads Control via Data-Enabled Policy Optimization"
      - "Suspension regulation of medium-low-speed maglev trains via deep reinforcement learning"
      - "Velocity regulation for automatic train operation via meta-reinforcement learning"
      - "Setpoint tracking for the suspension system of medium-speed maglev trains via reinforcement learning"
