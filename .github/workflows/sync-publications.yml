name: Sync publications from ORCID

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync ORCID works
        run: ruby scripts/sync_publications.rb --write
        env:
          ORCID_ID: "0000-0003-3142-2903"

      - name: Commit changes
        run: |
          if git diff --quiet -- _data/cv.yml; then
            echo "No publication changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/cv.yml
          git commit -m "Sync publications from ORCID"
          git push
